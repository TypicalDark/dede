<text x='270' y='118' fill='#586274' font-size='11' text-anchor='start'>pseudocode of 0x1000</text>
<text x='272' y='138' fill='#586274' font-size='11' text-anchor='start'>// linear reconstruction of 78 instructions at 0x1000</text>
<text x='272' y='153' fill='#ffd24a' font-size='11' text-anchor='start'>void sub_1000() {</text>
<text x='272' y='168' fill='#586274' font-size='11' text-anchor='start'>    rax = 0x15;    // mov rax, 0x15</text>
<text x='272' y='183' fill='#586274' font-size='11' text-anchor='start'>    loc_1010();    // call 0x1010</text>
<text x='272' y='198' fill='#586274' font-size='11' text-anchor='start'>    hlt;    // hlt</text>
<text x='272' y='213' fill='#586274' font-size='11' text-anchor='start'>    nop;    // nop</text>
<text x='272' y='228' fill='#586274' font-size='11' text-anchor='start'>    nop;    // nop</text>
<text x='272' y='243' fill='#586274' font-size='11' text-anchor='start'>    nop;    // nop</text>
<text x='272' y='258' fill='#d9e2ee' font-size='11' text-anchor='start'></text>
<text x='272' y='273' fill='#d9e2ee' font-size='11' text-anchor='start'>loc_1010:</text>
<text x='272' y='288' fill='#586274' font-size='11' text-anchor='start'>    rax &lt;&lt;= 0x1;    // shl rax, 1</text>
<text x='272' y='303' fill='#586274' font-size='11' text-anchor='start'>    return;    // ret</text>
<text x='272' y='318' fill='#586274' font-size='11' text-anchor='start'>    mem += rax;    // add byte ptr [rax], al</text>
<text x='272' y='333' fill='#586274' font-size='11' text-anchor='start'>    mem += rax;    // add byte ptr [rax], al</text>
<text x='272' y='348' fill='#586274' font-size='11' text-anchor='start'>    mem += rax;    // add byte ptr [rax], al</text>
<text x='272' y='363' fill='#586274' font-size='11' text-anchor='start'>    mem += rax;    // add byte ptr [rax], al</text>
<text x='272' y='378' fill='#586274' font-size='11' text-anchor='start'>    mem += rax;    // add byte ptr [rax], al</text>
<text x='272' y='393' fill='#586274' font-size='11' text-anchor='start'>    mem += rax;    // add byte ptr [rax], al</text>
<text x='272' y='408' fill='#586274' font-size='11' text-anchor='start'>    mem += rax;    // add byte ptr [rax], al</text>
<text x='272' y='423' fill='#586274' font-size='11' text-anchor='start'>    mem += rax;    // add byte ptr [rax], al</text>
<text x='272' y='438' fill='#586274' font-size='11' text-anchor='start'>    mem += rax;    // add byte ptr [rax], al</text>
<text x='272' y='453' fill='#586274' font-size='11' text-anchor='start'>    mem += rax;    // add byte ptr [rax], al</text>
<text x='272' y='468' fill='#586274' font-size='11' text-anchor='start'>    mem += rax;    // add byte ptr [rax], al</text>
